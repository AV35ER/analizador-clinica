name: Validar aplicación Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generar y probar el frontend sin backend
        run: |
          python -m pip install -r requirements.txt
          python generar_frontend.py
          node --test test_cliente.cjs
          python -m unittest test_paridad -v
      - name: Construir y ejecutar pruebas en Linux
        run: docker build --tag analizador-clinica:test .
      - name: Iniciar Gunicorn
        run: docker run --detach --name clinica --env CORS_ORIGINS=http://127.0.0.1:8080 --publish 127.0.0.1:10000:10000 analizador-clinica:test
      - name: Probar HTTP y carga multipart
        run: python3 verificar_http.py --origen http://127.0.0.1:8080
      - name: Mostrar registros
        if: always()
        run: docker logs clinica
      - name: Detener contenedor
        if: always()
        run: docker rm --force clinica
